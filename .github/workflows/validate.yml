name: Validate static site
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the validator
        run: python -m unittest discover -s tests -v
      - name: Check pages and local references
        run: python tools/check_site.py
      - name: Check JavaScript syntax
        run: node --check assets/script.js
